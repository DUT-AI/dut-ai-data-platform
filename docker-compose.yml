services:
  db:
    image: postgres:16-alpine
    container_name: data-platform-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: data-platform-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: data-platform-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Label Studio Service (Annotation & Data Labeling Engine)
  # ---------------------------------------------------------------------------
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: data-platform-label-studio
    restart: always
    ports:
      - "8080:8080"
    environment:
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "false"
      LABEL_STUDIO_HOST: "${LABEL_STUDIO_HOST}"
      LABEL_STUDIO_PORT: "${LABEL_STUDIO_PORT}"
      LABEL_STUDIO_USERNAME: "${LABEL_STUDIO_USERNAME}"
      LABEL_STUDIO_PASSWORD: "${LABEL_STUDIO_PASSWORD}"
      LABEL_STUDIO_DISABLE_LEGACY_TOKENS: "false"
      DISABLE_LEGACY_TOKENS: "false"
    volumes:
      - label_studio_data:/label-studio/data
    networks:
      - platform-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  createbuckets:
    image: minio/mc:latest
    container_name: data-platform-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - platform-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      DEFAULT_BUCKET: ${DEFAULT_BUCKET}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/$${DEFAULT_BUCKET};
      /usr/bin/mc anonymous set download myminio/$${DEFAULT_BUCKET};
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: data-platform-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    networks:
      - platform-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: data-platform-worker
    restart: always
    env_file:
      - ./.env
    networks:
      - platform-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: data-platform-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    networks:
      - platform-net

networks:
  platform-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  label_studio_data:
