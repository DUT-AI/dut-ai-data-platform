[project]
name = "application"
version = "0.1.0"
description = "Shared Application Layer, Services and Use Cases"
requires-python = ">=3.11"
dependencies = [
    "domain",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
domain = { workspace = true }
