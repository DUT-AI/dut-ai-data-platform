[project]
name = "domain"
version = "0.1.0"
description = "Core Domain Entities and Interfaces"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "python-ulid>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
