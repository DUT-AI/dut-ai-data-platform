[project]
name = "infrastructure"
version = "0.1.0"
description = "Shared Infrastructure Layer, Repositories and External Integrations"
requires-python = ">=3.11"
dependencies = [
    "domain",
    "database",
    "shared",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
domain = { workspace = true }
database = { workspace = true }
shared = { workspace = true }
