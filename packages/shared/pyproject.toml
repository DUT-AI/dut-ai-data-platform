[project]
name = "shared"
version = "0.1.0"
description = "Shared Utilities, Storage Adapters and Auth Client"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "domain",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
domain = { workspace = true }
