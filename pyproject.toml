[tool.uv.workspace]
members = [
    "packages/*",
    "backend",
]

[project]
name = "dut-ai-data-platform"
version = "0.1.0"
description = "DUT AI Data Platform Workspace"
requires-python = ">=3.11"
dependencies = [
    "domain",
    "database",
    "shared",
    "application",
    "infrastructure",
    "backend",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
]

[tool.uv.sources]
domain = { workspace = true }
database = { workspace = true }
shared = { workspace = true }
application = { workspace = true }
infrastructure = { workspace = true }
backend = { workspace = true }

[tool.ruff]
target-version = "py312"
exclude = [".agent", ".venv", ".git"]

[tool.ruff.lint]
ignore = ["B008", "BLE001", "UP046"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = [".agent", ".venv"]
