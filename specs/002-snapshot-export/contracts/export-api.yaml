openapi: 3.1.0
info:
  title: DUT AI Data Platform - Snapshot Export API
  version: 1.0.0
  description: REST API for initiating, tracking, and downloading snapshot export packages.

paths:
  /api/v1/projects/{project_id}/snapshots/{snapshot_id}/exports:
    post:
      summary: Initiate an export from a finalized snapshot
      description: |
        Creates or retrieves an existing idempotent Export Package for the given snapshot
        and export options. Returns HTTP 202 if processing, or HTTP 200 if already ready.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: snapshot_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCreateRequest'
      responses:
        '202':
          description: Export package creation accepted and currently processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPackageResponse'
        '200':
          description: Existing immutable export package retrieved (idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPackageResponse'
        '400':
          description: Invalid request, scale limit exceeded, or incompatible format.
        '403':
          description: Unauthorized role (Requires Owner or Admin).
        '404':
          description: Snapshot not found.
        '409':
          description: Snapshot not in READY status.

  /api/v1/projects/{project_id}/exports:
    get:
      summary: List export packages for a project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: snapshot_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [processing, ready, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of export packages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportPackageResponse'

  /api/v1/projects/{project_id}/exports/{package_id}:
    get:
      summary: Get details of an export package
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: package_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Export package details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPackageResponse'
        '404':
          description: Export package not found.

    delete:
      summary: Delete an export package
      description: Permanently purges the export archive from storage and deletes metadata.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: package_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Package successfully deleted.
        '403':
          description: Requires Owner or Admin role.
        '404':
          description: Package not found.

  /api/v1/projects/{project_id}/exports/{package_id}/download:
    get:
      summary: Download export package archive
      description: Generates a temporary Presigned S3 GET URL (30-minute validity) or redirects via HTTP 307.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: package_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '307':
          description: Temporary redirect to Presigned MinIO/S3 URL.
        '200':
          description: Presigned download URL returned in JSON payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                  expires_in_seconds:
                    type: integer
                    example: 1800
        '404':
          description: Export package not found or not in READY status.

components:
  schemas:
    ExportCreateRequest:
      type: object
      required:
        - format
      properties:
        format:
          type: string
          enum: [yolo, coco, csv, canonical_json, canonical_jsonl]
        target_output_id:
          type: string
          nullable: true
          description: Required for single-task formats (yolo, coco, csv); optional for canonical_json.
        media_mode:
          type: string
          enum: [labels_only, full_bundle]
          default: labels_only
        annotated_only:
          type: boolean
          default: false

    ExportPackageResponse:
      type: object
      required:
        - id
        - project_id
        - snapshot_id
        - format
        - media_mode
        - annotated_only
        - status
        - item_count
        - created_by
        - created_at
      properties:
        id:
          type: string
        project_id:
          type: string
        snapshot_id:
          type: string
        format:
          type: string
        target_output_id:
          type: string
          nullable: true
        media_mode:
          type: string
        annotated_only:
          type: boolean
        status:
          type: string
          enum: [processing, ready, failed]
        storage_uri:
          type: string
          nullable: true
        checksum:
          type: string
          nullable: true
        file_size_bytes:
          type: integer
          nullable: true
        item_count:
          type: integer
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
        finalized_at:
          type: string
          format: date-time
          nullable: true
